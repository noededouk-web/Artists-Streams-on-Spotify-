app = 'artists-streams-on-spotify-youtube'
primary_region = 'cdg'

[build]

[env]
  PORT = '8000'

[mounts]
  source = 'sqlite_data'
  destination = '/app/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8000

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20
